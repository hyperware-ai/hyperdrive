[package]
name = "homepage"
version = "0.1.2"
edition = "2021"

[features]
simulation-mode = []

[dependencies]
anyhow = "1.0"
bincode = "1.3.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wit-bindgen = "0.42.1"

[dependencies.hyperware_process_lib]
features = ["hyperapp"]
version = "3.0.0"

[lib]
crate-type = ["cdylib"]

[package.metadata.component]
package = "hyperware:process"
