[dependencies]
anyhow = "1.0"
base64 = "0.21"
flate2 = "1.0"
futures = "0.3"
process_macros = "0.1"
rand = "0.8"
serde_json = "1.0"
wit-bindgen = "0.42.1"

[dependencies.hyperapp_macro]
version = "0.2.0"

[dependencies.hyperware-crdt]
git = "https://github.com/hyperware-ai/hyperware-crdt"
rev = "a0aefa9"

[dependencies.hyperware-pubsub-core]
git = "https://github.com/hyperware-ai/hyperware-pubsub"
rev = "abd30a6"

[dependencies.hyperware_process_lib]
features = ["hyperapp"]
version = "3.0.0"

[dependencies.serde]
features = [
    "derive",
    "rc",
]
version = "1.0"

[dev-dependencies]
rmp-serde = "1"

[features]
disable-notifications = []
simulation-mode = []
test-helpers = []

[lib]
crate-type = [
    "cdylib",
    "rlib",
]

[package]
edition = "2021"
name = "chat"
version = "0.1.0"

[package.metadata.component]
package = "hyperware:process"
